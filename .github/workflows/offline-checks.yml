name: Offline checks

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Verify environment report
        run: python scripts/check_environment.py --json
      - name: h3d entrypoint smoke
        run: |
          python scripts/h3d.py --list
          python scripts/h3d.py catalog --list
          python scripts/h3d.py catalog --acks
      - name: Environment doctor (advisory)
        run: python scripts/doctor.py --json
      - name: Run offline regression suite
        run: python scripts/run_offline_checks.py

  windows:
    # 這個 skill 主要在使用者的 Windows 上跑（路徑分隔、CRLF、ffmpeg 參數、顯存查詢），
    # 只跑單元測試，避免與 ubuntu 的 self-test 重複佔時間。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install test dependencies
        run: python -m pip install --upgrade pip Pillow
      - name: Unit tests (Windows)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          python -m unittest discover -s tests
